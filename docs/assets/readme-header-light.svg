<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-label="Elephant-Referee Model">
<style>
  .ink{fill:#1f2328}.muted{fill:#59636e}.ele{fill:#9aa3ae}.ear{fill:#7b848f}.water{fill:#e3f1fa;stroke:#7fb3d5}.fish{fill:#f08c2e}
  
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .swim{animation:swim 2.4s ease-in-out infinite alternate}
  @keyframes swim{from{transform:translate(-4px,0)}to{transform:translate(4px,-2px)}}
  @media (prefers-reduced-motion: reduce){.swim{animation:none}}
</style>
<g transform="translate(46,62) scale(.62)">
  <rect class="ele" x="-48" y="42" width="20" height="34" rx="6"/>
  <rect class="ele" x="22" y="42" width="20" height="34" rx="6"/>
  <ellipse class="ele" cx="-8" cy="22" rx="62" ry="40"/>
  <circle class="ele" cx="50" cy="-10" r="34"/>
  <ellipse class="ear" cx="30" cy="-6" rx="20" ry="27"/>
  <path class="ele" d="M76 0 C92 18 90 48 80 62 C76 68 68 66 70 58 C76 42 72 24 62 12 Z"/>
  <circle class="ink" cx="62" cy="-18" r="3.5"/>
</g>
<g transform="translate(130,62)">
  <circle class="water" r="26" stroke-width="2"/>
  <g class="swim"><ellipse class="fish" rx="11" ry="7"/><path class="fish" d="M-9 0 l-9 -7 v14 z"/><circle class="ink" cx="5" cy="-2" r="1.7"/></g>
</g>
<text class="ink" x="176" y="60" font-size="34" font-weight="700" letter-spacing="-.5">Elephant-Referee</text>
<text class="muted" x="178" y="92" font-size="20" font-weight="500" letter-spacing="3">MODEL · ERM</text>
</svg>
